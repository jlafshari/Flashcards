<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Timing Test</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .test-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
        .test-log {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Animation Timing Test</h1>
        <p>This test verifies that the animation completes before navigation occurs.</p>
        
        <div class="controls">
            <button id="easy-btn" class="btn btn-easy">Easy ✓</button>
            <button id="review-btn" class="btn btn-review">Review Again ↻</button>
        </div>
        
        <div class="test-log" id="log">
            <div class="log-entry">Ready - Click buttons or press 1/2 keys</div>
        </div>
    </div>

    <script>
        const logEl = document.getElementById('log');
        
        function log(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function animateButton(buttonId) {
            const button = document.getElementById(buttonId);
            log(`Adding .animating class to ${buttonId}`);
            button.classList.add('animating');
            
            setTimeout(() => {
                log(`Removing .animating class from ${buttonId}`);
                button.classList.remove('animating');
            }, 300);
        }
        
        function markEasy() {
            log('markEasy() called');
            animateButton('easy-btn');
            
            setTimeout(() => {
                log('Navigation triggered (300ms delay)');
                // Simulate navigation - in real app this would be nextCard()
            }, 300);
        }
        
        function markForReview() {
            log('markForReview() called');
            animateButton('review-btn');
            
            setTimeout(() => {
                log('Navigation triggered (300ms delay)');
                // Simulate navigation - in real app this would be nextCard()
            }, 300);
        }
        
        document.getElementById('easy-btn').addEventListener('click', markEasy);
        document.getElementById('review-btn').addEventListener('click', markForReview);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                e.preventDefault();
                log('Key "1" pressed');
                markEasy();
            } else if (e.key === '2') {
                e.preventDefault();
                log('Key "2" pressed');
                markForReview();
            }
        });
    </script>
</body>
</html>
