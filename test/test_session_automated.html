<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Feature Automated Tests</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        #output {
            background: white;
            padding: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }
        h1 {
            color: #667eea;
        }
    </style>
</head>
<body>
    <h1>Study Session Feature - Automated Tests</h1>
    <div id="output">Running tests...</div>
    
    <script src="app.js"></script>
    <script>
        // Capture console output
        const output = document.getElementById('output');
        const originalLog = console.log;
        const originalAssert = console.assert;
        let testOutput = '';
        
        console.log = function(...args) {
            const message = args.join(' ');
            testOutput += message + '\n';
            output.textContent = testOutput;
            originalLog.apply(console, args);
        };
        
        console.assert = function(condition, message) {
            if (!condition) {
                const error = '❌ ASSERTION FAILED: ' + message;
                testOutput += error + '\n';
                output.textContent = testOutput;
                output.style.color = 'red';
                throw new Error(message);
            }
            originalAssert.apply(console, arguments);
        };
    </script>
    <script src="test_session_feature.js"></script>
</body>
</html>
