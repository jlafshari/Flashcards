<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Visual Test</title>
    <link rel="stylesheet" href="../source/styles.css">
</head>
<body>
    <div class="container">
        <h1>Edit Feature Visual Test</h1>
        
        <div class="card-list">
            <h2>Normal Card View</h2>
            <div id="cards-list-normal"></div>
            
            <h2>Edit Mode View</h2>
            <div id="cards-list-edit"></div>
        </div>
    </div>

    <script src="../source/app.js"></script>
    <script>
        // Test that edit functionality works
        console.log('Testing edit feature...');
        
        // Add test cards
        app.addCard('Здравей', 'Hello', 'Greetings');
        app.addCard('Довиждане', 'Goodbye', 'Greetings');
        
        // Render normal view
        const normalList = document.getElementById('cards-list-normal');
        normalList.innerHTML = app.cards.map(card => `
            <div class="card-item">
                <div class="card-item-content">
                    <div class="card-item-front">${app.escapeHtml(card.bulgarian)}</div>
                    <div class="card-item-back">${app.escapeHtml(card.english)}</div>
                    ${card.category ? `<div class="card-item-category">Category: ${app.escapeHtml(card.category)}</div>` : ''}
                </div>
                <div class="card-item-actions">
                    <button class="btn btn-edit" onclick="alert('Edit button works!')">Edit</button>
                    <button class="btn btn-danger" onclick="alert('Delete button works!')">Delete</button>
                </div>
            </div>
        `).join('');
        
        // Render edit view
        const editList = document.getElementById('cards-list-edit');
        const card = app.cards[0];
        editList.innerHTML = `
            <div class="card-item">
                <div class="card-item-edit-form">
                    <input type="text" id="edit-bulgarian-${card.id}" value="${app.escapeHtml(card.bulgarian)}" placeholder="Bulgarian">
                    <input type="text" id="edit-english-${card.id}" value="${app.escapeHtml(card.english)}" placeholder="English">
                    <input type="text" id="edit-category-${card.id}" value="${app.escapeHtml(card.category)}" placeholder="Category (optional)">
                    <div class="card-item-edit-actions">
                        <button class="btn btn-save" onclick="alert('Save button works!')">Save</button>
                        <button class="btn btn-cancel" onclick="alert('Cancel button works!')">Cancel</button>
                    </div>
                </div>
            </div>
        `;
        
        console.log('✓ Visual test loaded');
        console.log('✓ Check that:');
        console.log('  1. Edit button appears next to Delete button');
        console.log('  2. Edit button has purple/blue color');
        console.log('  3. Edit form shows input fields');
        console.log('  4. Save button is green');
        console.log('  5. Cancel button is gray');
    </script>
</body>
</html>
