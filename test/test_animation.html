<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Animation - Feedback Buttons</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 40px;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .test-instructions {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .test-instructions h2 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        .test-instructions ul {
            margin-left: 20px;
        }
        .test-instructions li {
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }
        .status {
            text-align: center;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
            margin-top: 30px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎴 Animation Test</h1>
        
        <div class="test-instructions">
            <h2>Test Instructions</h2>
            <ul>
                <li><strong>Click Test:</strong> Click each button and watch for animation</li>
                <li><strong>Keyboard Test:</strong> Press <kbd>1</kbd> for Easy or <kbd>2</kbd> for Review</li>
                <li><strong>Expected:</strong> Button should pulse and glow when activated</li>
            </ul>
        </div>

        <div class="button-group">
            <button id="easy-btn" class="btn btn-easy">Easy ✓</button>
            <button id="review-btn" class="btn btn-review">Review Again ↻</button>
        </div>

        <div id="status" class="status">
            Ready to test! Try clicking or using keyboard shortcuts.
        </div>
    </div>

    <script>
        const status = document.getElementById('status');
        let testCount = 0;

        function animateButton(buttonId, method) {
            const button = document.getElementById(buttonId);
            button.classList.add('animating');
            
            testCount++;
            status.textContent = `✓ Test #${testCount}: ${buttonId === 'easy-btn' ? 'Easy' : 'Review'} button animated via ${method}`;
            status.style.background = buttonId === 'easy-btn' ? '#e8f5e9' : '#fff3e0';
            
            setTimeout(() => {
                button.classList.remove('animating');
            }, 300);
        }

        // Click handlers
        document.getElementById('easy-btn').addEventListener('click', () => {
            animateButton('easy-btn', 'click');
        });

        document.getElementById('review-btn').addEventListener('click', () => {
            animateButton('review-btn', 'click');
        });

        // Keyboard handlers
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                e.preventDefault();
                animateButton('easy-btn', 'keyboard (1)');
            } else if (e.key === '2') {
                e.preventDefault();
                animateButton('review-btn', 'keyboard (2)');
            }
        });
    </script>
</body>
</html>
