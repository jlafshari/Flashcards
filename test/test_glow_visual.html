<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Animation Test</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            padding: 50px;
        }
        .test-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .instructions {
            margin-bottom: 30px;
            color: #666;
        }
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .log {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Glow Animation Visual Test</h1>
        <div class="instructions">
            <p><strong>Instructions:</strong></p>
            <p>Click the buttons or press keyboard shortcuts to see the glow animation.</p>
            <p><strong>Keyboard:</strong> Press '1' for Easy, '2' for Review Again</p>
            <p>You should see a glowing box-shadow pulse around the button.</p>
        </div>
        
        <div class="button-group">
            <button id="easy-btn" class="btn btn-easy">Easy (1)</button>
            <button id="review-btn" class="btn btn-review">Review Again (2)</button>
        </div>

        <div class="log">
            <div class="log-entry">Ready to test...</div>
        </div>
    </div>

    <script>
        const log = document.querySelector('.log');
        
        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function animateButton(buttonId, trigger) {
            const button = document.getElementById(buttonId);
            addLog(`Animating ${buttonId} (triggered by: ${trigger})`);
            
            button.classList.add('animating');
            
            setTimeout(() => {
                button.classList.remove('animating');
                addLog(`Animation complete for ${buttonId}`);
            }, 300);
        }

        // Button click handlers
        document.getElementById('easy-btn').addEventListener('click', () => {
            animateButton('easy-btn', 'click');
        });

        document.getElementById('review-btn').addEventListener('click', () => {
            animateButton('review-btn', 'click');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                e.preventDefault();
                animateButton('easy-btn', 'keyboard (1)');
            } else if (e.key === '2') {
                e.preventDefault();
                animateButton('review-btn', 'keyboard (2)');
            }
        });

        addLog('Test page loaded. Try clicking buttons or pressing 1/2 keys.');
    </script>
</body>
</html>
