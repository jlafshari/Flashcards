<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Merged UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎴 Merged UI Test</h1>
        
        <h2>With Categories</h2>
        <div class="study-options">
            <div class="category-filter-inline">
                <h3>Categories:</h3>
                <div class="category-checkboxes">
                    <label class="category-checkbox">
                        <input type="checkbox" checked>
                        <span>Food</span>
                    </label>
                    <label class="category-checkbox">
                        <input type="checkbox" checked>
                        <span>Greetings</span>
                    </label>
                    <label class="category-checkbox">
                        <input type="checkbox" checked>
                        <span>Numbers</span>
                    </label>
                    <label class="category-checkbox">
                        <input type="checkbox" checked>
                        <span>Uncategorized</span>
                    </label>
                </div>
            </div>
            
            <div class="direction-selector">
                <button class="direction-btn active">Bulgarian → English</button>
                <button class="direction-btn">English → Bulgarian</button>
            </div>
        </div>
        
        <h2>Without Categories (Direction Only)</h2>
        <div class="study-options">
            <div class="direction-selector">
                <button class="direction-btn active">Bulgarian → English</button>
                <button class="direction-btn">English → Bulgarian</button>
            </div>
        </div>
        
        <h2>Mobile View Simulation (resize window to see)</h2>
        <p>The categories and direction buttons should stack vertically on narrow screens.</p>
    </div>
</body>
</html>
