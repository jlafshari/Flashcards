<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Bulgarian to English</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="tabs">
            <h1>🎴 Flashcards</h1>
            <button class="tab-button active" data-tab="study">Study</button>
            <button class="tab-button" data-tab="manage">Manage Cards</button>
            <button class="tab-button" data-tab="stats">Stats</button>
        </nav>

        <!-- Study Tab -->
        <div id="study-tab" class="tab-content active">
            <div class="study-user-bar">
                <label for="user-select">Studying as:</label>
                <select id="user-select"></select>
                <span id="new-user-form" class="new-user-form" style="display: none;">
                    <input type="text" id="new-user-input" placeholder="Name" maxlength="40">
                    <button id="new-user-save" class="new-user-btn primary">Add</button>
                    <button id="new-user-cancel" class="new-user-btn">Cancel</button>
                </span>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Cards:</span>
                    <span id="total-cards" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Reviewed Today:</span>
                    <span id="reviewed-today" class="stat-value">0</span>
                </div>
            </div>

            <div id="no-cards-message" class="message">
                <p>No flashcards yet! Go to "Manage Cards" to add some.</p>
            </div>

            <div id="study-options" class="study-options" style="display: none;">
                <div id="category-filter" class="category-filter-inline" style="display: none;">
                    <div id="category-checkboxes" class="category-checkboxes">
                        <!-- Category checkboxes will be dynamically added here -->
                    </div>
                </div>
                
                <div class="session-options-inline">
                    <label class="session-option-checkbox">
                        <input type="checkbox" id="shuffle-checkbox">
                        <span>Shuffle cards</span>
                    </label>
                    
                    <label class="session-option-input">
                        <span>Card limit:</span>
                        <input type="number" id="card-limit-input" min="1" value="10">
                    </label>
                </div>
                
                <div class="direction-selector">
                    <button id="direction-bg-en" class="direction-btn active">Bulgarian → English</button>
                    <button id="direction-en-bg" class="direction-btn">English → Bulgarian</button>
                </div>
            </div>

            <button id="start-session-btn" class="btn btn-start-session" style="display: none;">Start Study Session</button>

            <div id="card-container" class="card-container" style="display: none;">
                <div class="flashcard" id="flashcard">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-language" id="card-front-lang">Bulgarian</div>
                            <div class="card-text" id="card-front-text"></div>
                        </div>
                        <div class="card-back">
                            <div class="card-language" id="card-back-lang">English</div>
                            <div class="card-text" id="card-back-text"></div>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="prev-btn" class="btn btn-secondary">← Previous</button>
                    <button id="flip-btn" class="btn btn-primary">Flip Card</button>
                    <span id="card-position" class="card-position">1 / 1</span>
                    <button id="next-btn" class="btn btn-secondary">Next →</button>
                    <button id="easy-btn" class="btn btn-easy" style="display: none;">Easy ✓</button>
                    <button id="review-btn" class="btn btn-review" style="display: none;">Review Again ↻</button>
                    <button id="bury-btn" class="btn btn-bury" style="display: none;">Bury ⏸</button>
                </div>

                <button id="end-session-btn" class="btn btn-end-session" style="display: none;">End Session</button>
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="stats-tab" class="tab-content">
            <div class="stats-controls">
                <div class="stats-range">
                    <button id="stats-range-7" class="range-btn active">Last 7 days</button>
                    <button id="stats-range-30" class="range-btn">Last 30 days</button>
                </div>
                <label class="stats-user-filter">
                    <span>Show:</span>
                    <select id="stats-user-select"></select>
                </label>
            </div>

            <div id="stats-summary" class="stats-summary"></div>

            <div id="stats-empty" class="message" style="display: none;">
                <p>No study time recorded yet. Finish a session on the Study tab and it will show up here.</p>
            </div>

            <div class="stats-section">
                <h2 id="stats-chart-title">Time per day</h2>
                <div id="stats-chart" class="stats-chart"></div>
            </div>

            <div class="stats-section">
                <h2>Time by user</h2>
                <div id="stats-user-table" class="stats-user-table"></div>
            </div>
        </div>

        <!-- Manage Cards Tab -->
        <div id="manage-tab" class="tab-content">
            <div class="import-export-section">
                <div class="import-export-buttons">
                    <button id="export-btn" class="btn btn-secondary">Export Cards</button>
                    <button id="import-merge-btn" class="btn btn-secondary">Import Cards (Merge)</button>
                    <button id="import-replace-btn" class="btn btn-secondary">Import Cards (Replace)</button>
                </div>
                <input type="file" id="import-file-input" accept=".csv" style="display: none;">
            </div>

            <div class="add-card-form">
                <h2>Add New Card</h2>
                <div class="form-group">
                    <input type="text" id="bulgarian-input" placeholder="Enter Bulgarian word or phrase" autofocus>
                </div>
                <div class="form-group">
                    <input type="text" id="english-input" placeholder="Enter English translation">
                </div>
                <div class="form-group-inline">
                    <input type="text" id="category-input" placeholder="Enter category (e.g., Food, Greetings)">
                    <button id="add-card-btn" class="btn btn-primary">Add Card</button>
                </div>
            </div>

            <div id="manage-category-filter" class="manage-category-filter" style="display: none;">
                <h2>Filter by Category</h2>
                <div id="manage-category-checkboxes" class="category-checkboxes">
                    <!-- Category checkboxes will be dynamically added here -->
                </div>
            </div>

            <div class="card-list">
                <h2>All Cards (<span id="card-count">0</span>)</h2>
                <div id="cards-list"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
